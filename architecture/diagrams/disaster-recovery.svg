<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-label="Disaster Recovery and Trusted Recency"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#244d68"/></marker></defs><rect width="1200" height="790" fill="white"/><g font-family="Arial,sans-serif" fill="#182c3c"><text x="35" y="40" font-size="27" font-weight="bold">Disaster Recovery and Trusted Recency</text><text x="35" y="72" font-size="16">Retention preserves versions; independently governed current evidence determines which version is safe.</text><path d="M365 187.5L435 187.5" stroke="#244d68" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M600.0 245L600.0 385" stroke="#244d68" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1000.0 245L600.0 385" stroke="#244d68" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M600.0 500L200.0 620" stroke="#244d68" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M600.0 500L600.0 620" stroke="#244d68" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M600.0 500L1000.0 620" stroke="#9a3d36" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="35" y="130" width="330" height="115" rx="7" stroke="#244d68" fill="#f1f5f8" stroke-width="1.5"/><text x="200.0" y="159" text-anchor="middle" font-size="18" font-weight="bold">Signer snapshot</text><text x="200.0" y="184" text-anchor="middle" font-size="15">Epoch / nonce / consumed IDs</text><text x="200.0" y="209" text-anchor="middle" font-size="15">Application envelope before upload</text><rect x="435" y="130" width="330" height="115" rx="7" stroke="#244d68" fill="#f1f5f8" stroke-width="1.5"/><text x="600.0" y="159" text-anchor="middle" font-size="18" font-weight="bold">Retained S3 versions</text><text x="600.0" y="184" text-anchor="middle" font-size="15">Backup-prefix writer only</text><text x="600.0" y="209" text-anchor="middle" font-size="15">COMPLIANCE + versioning</text><rect x="835" y="130" width="330" height="115" rx="7" stroke="#2b6a54" fill="#eef6f1" stroke-width="1.5"/><text x="1000.0" y="159" text-anchor="middle" font-size="18" font-weight="bold">Independent current anchor</text><text x="1000.0" y="184" text-anchor="middle" font-size="15">Digest / generation / policy epoch</text><text x="1000.0" y="209" text-anchor="middle" font-size="15">Different publisher and admin</text><rect x="435" y="385" width="330" height="115" rx="7" stroke="#2b6a54" fill="#eef6f1" stroke-width="1.5"/><text x="600.0" y="414" text-anchor="middle" font-size="18" font-weight="bold">Reviewed restore gate</text><text x="600.0" y="439" text-anchor="middle" font-size="15">Two declared recovery approvals</text><text x="600.0" y="464" text-anchor="middle" font-size="15">Match snapshot + trusted latest</text><rect x="35" y="620" width="330" height="95" rx="7" stroke="#2b6a54" fill="#eef6f1" stroke-width="1.5"/><text x="200.0" y="649" text-anchor="middle" font-size="18" font-weight="bold">Reject stale / missing evidence</text><text x="200.0" y="674" text-anchor="middle" font-size="15">Fail closed; preserve history</text><rect x="435" y="620" width="330" height="95" rx="7" stroke="#244d68" fill="#f1f5f8" stroke-width="1.5"/><text x="600.0" y="649" text-anchor="middle" font-size="18" font-weight="bold">Restore current state</text><text x="600.0" y="674" text-anchor="middle" font-size="15">Reconcile sessions and signed bytes</text><rect x="835" y="620" width="330" height="95" rx="7" stroke="#9a3d36" fill="#fcf1ef" stroke-width="1.5"/><text x="1000.0" y="649" text-anchor="middle" font-size="18" font-weight="bold">Joint state + anchor rollback</text><text x="1000.0" y="674" text-anchor="middle" font-size="15">Counterexample: replay is possible</text><text x="35" y="768" font-size="15">Solid: intended control/data path. Dashed red: explicit unsafe capability or lost trust assumption.</text></g></svg>
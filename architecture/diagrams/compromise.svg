<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-label="Compromise Scenarios and Consequences"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#244d68"/></marker></defs><rect width="1200" height="740" fill="white"/><g font-family="Arial,sans-serif" fill="#182c3c"><text x="35" y="40" font-size="27" font-weight="bold">Compromise Scenarios and Consequences</text><text x="35" y="72" font-size="16">Executed capability models, not AWS escalation tests, MPC integration or a production vulnerability.</text><path d="M465 170.0L735 170.0" stroke="#244d68" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M465 310.0L735 310.0" stroke="#9a3d36" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><path d="M465 450.0L735 450.0" stroke="#244d68" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M465 590.0L735 590.0" stroke="#9a3d36" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="35" y="125" width="430" height="90" rx="7" stroke="#244d68" fill="#f1f5f8" stroke-width="1.5"/><text x="250.0" y="154" text-anchor="middle" font-size="18" font-weight="bold">One signer / one domain admin</text><text x="250.0" y="179" text-anchor="middle" font-size="15">One share or execution boundary</text><rect x="735" y="125" width="430" height="90" rx="7" stroke="#2b6a54" fill="#eef6f1" stroke-width="1.5"/><text x="950.0" y="154" text-anchor="middle" font-size="18" font-weight="bold">No quorum control</text><text x="950.0" y="179" text-anchor="middle" font-size="15">One share and availability still exposed</text><rect x="35" y="265" width="430" height="90" rx="7" stroke="#9a3d36" fill="#fcf1ef" stroke-width="1.5"/><text x="250.0" y="294" text-anchor="middle" font-size="18" font-weight="bold">Two signers / shared deployer</text><text x="250.0" y="319" text-anchor="middle" font-size="15">Two or more signing domains controlled</text><rect x="735" y="265" width="430" height="90" rx="7" stroke="#9a3d36" fill="#fcf1ef" stroke-width="1.5"/><text x="950.0" y="294" text-anchor="middle" font-size="18" font-weight="bold">Direct signing authority</text><text x="950.0" y="319" text-anchor="middle" font-size="15">Application approvals can be bypassed</text><rect x="35" y="405" width="430" height="90" rx="7" stroke="#244d68" fill="#f1f5f8" stroke-width="1.5"/><text x="250.0" y="434" text-anchor="middle" font-size="18" font-weight="bold">Coordinator only</text><text x="250.0" y="459" text-anchor="middle" font-size="15">Orchestration + retained signed bytes</text><rect x="735" y="405" width="430" height="90" rx="7" stroke="#2b6a54" fill="#eef6f1" stroke-width="1.5"/><text x="950.0" y="434" text-anchor="middle" font-size="18" font-weight="bold">No new approval authority</text><text x="950.0" y="459" text-anchor="middle" font-size="15">Issued bytes remain portable</text><rect x="35" y="545" width="430" height="90" rx="7" stroke="#9a3d36" fill="#fcf1ef" stroke-width="1.5"/><text x="250.0" y="574" text-anchor="middle" font-size="18" font-weight="bold">Both approval keys</text><text x="250.0" y="599" text-anchor="middle" font-size="15">Human intent can be misrepresented</text><rect x="735" y="545" width="430" height="90" rx="7" stroke="#9a3d36" fill="#fcf1ef" stroke-width="1.5"/><text x="950.0" y="574" text-anchor="middle" font-size="18" font-weight="bold">Policy-permitted business fraud</text><text x="950.0" y="599" text-anchor="middle" font-size="15">Standing signer limits still apply</text><text x="35" y="718" font-size="15">Solid: intended control/data path. Dashed red: explicit unsafe capability or lost trust assumption.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-label="IAM Trust and Deployment Boundaries"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#244d68"/></marker></defs><rect width="1200" height="790" fill="white"/><g font-family="Arial,sans-serif" fill="#182c3c"><text x="35" y="40" font-size="27" font-weight="bold">IAM Trust and Deployment Boundaries</text><text x="35" y="72" font-size="16">Separate domain administration is an assumption to verify. No shared AWS deployment role is created.</text><path d="M600.0 190L200.0 290" stroke="#9a3d36" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><path d="M200.0 385L200.0 465" stroke="#244d68" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M200.0 560L200.0 640" stroke="#244d68" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M600.0 190L600.0 290" stroke="#9a3d36" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><path d="M600.0 385L600.0 465" stroke="#244d68" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M600.0 560L600.0 640" stroke="#244d68" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M600.0 190L1000.0 290" stroke="#9a3d36" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/><path d="M1000.0 385L1000.0 465" stroke="#244d68" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1000.0 560L1000.0 640" stroke="#244d68" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="425" y="110" width="350" height="80" rx="7" stroke="#9a3d36" fill="#fcf1ef" stroke-width="1.5"/><text x="600.0" y="139" text-anchor="middle" font-size="18" font-weight="bold">Shared deployment authority</text><text x="600.0" y="164" text-anchor="middle" font-size="15">Unsafe counterexample</text><rect x="35" y="290" width="330" height="95" rx="7" stroke="#244d68" fill="#f1f5f8" stroke-width="1.5"/><text x="200.0" y="319" text-anchor="middle" font-size="18" font-weight="bold">Domain A administrator</text><text x="200.0" y="344" text-anchor="middle" font-size="15">Exact local bootstrap roles</text><rect x="35" y="465" width="330" height="95" rx="7" stroke="#2b6a54" fill="#eef6f1" stroke-width="1.5"/><text x="200.0" y="494" text-anchor="middle" font-size="18" font-weight="bold">Deploy A / key admin A</text><text x="200.0" y="519" text-anchor="middle" font-size="15">Runtime A + envelope context A</text><rect x="35" y="640" width="330" height="80" rx="7" stroke="#244d68" fill="#f1f5f8" stroke-width="1.5"/><text x="200.0" y="669" text-anchor="middle" font-size="18" font-weight="bold">Signer A</text><text x="200.0" y="694" text-anchor="middle" font-size="15">One domain does not control quorum</text><rect x="435" y="290" width="330" height="95" rx="7" stroke="#244d68" fill="#f1f5f8" stroke-width="1.5"/><text x="600.0" y="319" text-anchor="middle" font-size="18" font-weight="bold">Domain B administrator</text><text x="600.0" y="344" text-anchor="middle" font-size="15">Exact local bootstrap roles</text><rect x="435" y="465" width="330" height="95" rx="7" stroke="#2b6a54" fill="#eef6f1" stroke-width="1.5"/><text x="600.0" y="494" text-anchor="middle" font-size="18" font-weight="bold">Deploy B / key admin B</text><text x="600.0" y="519" text-anchor="middle" font-size="15">Runtime B + envelope context B</text><rect x="435" y="640" width="330" height="80" rx="7" stroke="#244d68" fill="#f1f5f8" stroke-width="1.5"/><text x="600.0" y="669" text-anchor="middle" font-size="18" font-weight="bold">Signer B</text><text x="600.0" y="694" text-anchor="middle" font-size="15">One domain does not control quorum</text><rect x="835" y="290" width="330" height="95" rx="7" stroke="#244d68" fill="#f1f5f8" stroke-width="1.5"/><text x="1000.0" y="319" text-anchor="middle" font-size="18" font-weight="bold">Domain C administrator</text><text x="1000.0" y="344" text-anchor="middle" font-size="15">Exact local bootstrap roles</text><rect x="835" y="465" width="330" height="95" rx="7" stroke="#2b6a54" fill="#eef6f1" stroke-width="1.5"/><text x="1000.0" y="494" text-anchor="middle" font-size="18" font-weight="bold">Deploy C / key admin C</text><text x="1000.0" y="519" text-anchor="middle" font-size="15">Runtime C + envelope context C</text><rect x="835" y="640" width="330" height="80" rx="7" stroke="#244d68" fill="#f1f5f8" stroke-width="1.5"/><text x="1000.0" y="669" text-anchor="middle" font-size="18" font-weight="bold">Signer C</text><text x="1000.0" y="694" text-anchor="middle" font-size="15">One domain does not control quorum</text><text x="35" y="768" font-size="15">Solid: intended control/data path. Dashed red: explicit unsafe capability or lost trust assumption.</text></g></svg>
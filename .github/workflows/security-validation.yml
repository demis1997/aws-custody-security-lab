name: Security validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-security-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Set up pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - name: Run local models and mocked infrastructure checks
        run: bash scripts/validate.sh
      - name: Check deterministic source and diagrams
        run: git diff --exit-code
      - name: Install checksum-verified secret scanner and scan intended files
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scanner_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$scanner_dir/checksums.txt"
          (cd "$scanner_dir" && sha256sum --check --ignore-missing checksums.txt && tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks)
          GITLEAKS_BIN="$scanner_dir/gitleaks" bash scripts/scan-secrets.sh
      - name: Upload fresh evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-security-evidence
          path: results/local/
          retention-days: 14
          if-no-files-found: warn
